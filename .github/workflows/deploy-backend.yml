name: Deploy Backend to Render

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**' # Only triggers if files in your backend folder change

jobs:
  deploy-render:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Web Service Deployment
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"